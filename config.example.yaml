# Copy to config.yaml and edit. Secrets (MT5 password) go in environment variables, not here.
watchlist: [EURUSD, GBPUSD, USDJPY, XAUUSD]
decision_timeframe: H1          # the agent is woken at the close of each H1 bar (M15 / H1 / H4 / D1)
db_path: journal.sqlite
commission_per_lot: 7.0         # round-turn cost estimate in account currency

risk:
  max_risk_per_trade_pct: 1.0
  max_total_open_risk_pct: 3.0
  max_open_positions: 3
  max_positions_per_symbol: 1
  max_daily_loss_pct: 3.0       # no new trades after this daily loss
  daily_profit_target_pct: 2.0  # shown to the agent as information only
  stop_trading_at_target: false
  min_reward_risk: 1.0
  require_take_profit: false
  max_spread_to_stop_ratio: 0.2
  max_trades_per_day: 10
  max_currency_exposure_pct: 2.0     # net risk per currency across correlated trades
  news_blackout_minutes_before: 30
  news_blackout_minutes_after: 15
  news_blackout_min_impact: High
  max_weekly_loss_pct: 5.0
  max_monthly_loss_pct: 8.0
  drawdown_risk_tiers: [[5.0, 0.5], [10.0, 0.25]]   # [drawdown % from peak, risk multiplier]

agent:
  model: claude-opus-5-5
  effort: high                  # low | medium | high | xhigh | max
  language: ar                  # language of the agent's reasoning and reports
  max_tool_rounds: 15
  web_search: false             # live mode only (never used in backtests)
  daily_review: true
  notes_in_prompt: 15
  use_fallbacks: true

backtest:
  data_dir: data
  base_timeframe: M15           # files are read from data/<SYMBOL>_M15.csv
  start: null                   # e.g. "2024-01-01"
  end: null
  initial_balance: 10000
  hide_dates: true
  max_cycles: null

watchdog:
  poll_seconds: 10
  max_wakes_per_hour: 3              # protects your subscription usage
  close_all_on_daily_loss: false
  default_management: {break_even_at_r: 1.0, partial_at_r: null, trail_atr_mult: null, time_stop_hours: null}
  # wake_command: [powershell, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts\run_routine.ps1, -Routine, trade-cycle, -Context, "{context}"]

context:
  # Related instruments on YOUR broker (check the exact names in MT5 Market Watch), label: symbol
  intermarket_symbols: {}           # e.g. {US500: US500, DXY: USDX, OIL: WTICO, US10Y: USTBOND}
  oanda_practice: true              # OANDA retail positioning (env OANDA_API_TOKEN)
  cache_dir: cache
  notifications: true               # Telegram (env TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)

research:
  stats_path: cache/edge_stats.json
  max_hold_hours: 72
  oos_fraction: 0.3                  # last 30% of history = out-of-sample
  min_trades: 30
  min_oos_trades: 15

lab:
  holdout_fraction: 0.15            # most recent 15% of history stays untouched until `lab finalize`
  walk_forward_folds: 5
  min_oos_trades: 100
  min_holdout_trades: 30

mt5:
  login: null                   # or env MT5_LOGIN
  server: null                  # or env MT5_SERVER  (password: env MT5_PASSWORD)
  path: null                    # optional path to terminal64.exe
  allow_real_account: false     # the bot refuses to run on a real account unless this is true
  magic: 515151
  deviation_points: 20
  symbol_suffix: ""             # e.g. ".m" if your broker names symbols EURUSD.m

# Optional per-symbol overrides for the simulator (MT5 reads these from the broker):
# symbols:
#   EURUSD: {point: 0.00001, pip: 0.0001, contract_size: 100000, default_spread_points: 12}
